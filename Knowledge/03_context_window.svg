<text x="66" y="455" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">System rules</text><text x="66" y="482" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">and constraints</text>
