<text x="69" y="584" fill="#15345D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" text-anchor="start">WHY IT MATTERS</text>
<text x="69" y="621" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">Exceeding the budget requires trimming,</text><text x="69" y="649" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">summarising or selecting context.</text>
<text x="612" y="584" fill="#15345D" font-family="DejaVu Sans, Arial, sans-serif" font-size="19" font-weight="800" text-anchor="start">PRACTICAL EXAMPLE</text>
<text x="612" y="621" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">ShopBot can keep recent messages</text><text x="612" y="649" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">and summarise older history.</text>
