<text x="68" y="204" fill="#15345D" font-family="DejaVu Sans, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">WHAT IT IS</text>
<text x="68" y="228" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">A context window is the model’s finite token budget for</text><text x="68" y="255" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="20" font-weight="400" text-anchor="start">the active input, history and generated output.</text>
<text x="47" y="311" fill="#15345D" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">HOW IT WORKS</text>
