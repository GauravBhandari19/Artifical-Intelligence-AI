<text x="366" y="377" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">2</text>
<text x="352" y="418" fill="#15345D" font-family="DejaVu Sans, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">Conversation</text>
<text x="352" y="455" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">Recent messages</text><text x="352" y="482" fill="#233A54" font-family="DejaVu Sans, Arial, sans-serif" font-size="18" font-weight="400" text-anchor="start">and state</text>
