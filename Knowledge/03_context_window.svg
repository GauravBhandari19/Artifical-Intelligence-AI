<text x="81" y="84" fill="#FFFFFF" font-family="DejaVu Sans, Arial, sans-serif" font-size="38" font-weight="700" text-anchor="middle">3</text>
<text x="145" y="82" fill="#15345D" font-family="DejaVu Sans, Arial, sans-serif" font-size="43" font-weight="700" text-anchor="start">Context Window</text>
<text x="47" y="139" fill="#56708A" font-family="DejaVu Sans, Arial, sans-serif" font-size="22" font-weight="400" text-anchor="start">The amount of information a model can use in one request</text>
