<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878c8"/></marker></defs><rect x="2" y="2" width="1196" height="816" rx="20" fill="#f8fbfe" stroke="#c8d9e6" stroke-width="2"/><circle cx="75" cy="79" r="44" fill="#112d51"/><text x="75" y="94" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">7</text><text x="139" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#112d51" text-anchor="start">CHUNKING</text><text x="47" y="147" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#506479" text-anchor="start">Split long documents into searchable, useful pieces.</text><path d="M47 174 H1153" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="430" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="815" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="650" width="1110" height="124" rx="16" fill="#eaf3fa" stroke="#c9dce9" stroke-width="2"/><text x="65" y="686" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="start">IN SHORT</text><text x="68" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">1. FULL DOCUMENT</text><rect x="72" y="306" width="280" height="224" rx="16" fill="#f1f6fb" stroke="#cbdbe8" stroke-width="2"/><text x="92" y="351" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Refund policy</text><text x="92" y="385" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">────────────</text><text x="92" y="419" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Eligibility rules</text><text x="92" y="453" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Exceptions</text><text x="92" y="487" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Return windows</text><text x="92" y="521" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Shipping conditions</text><text x="69" y="576" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Too much text to use</text><text x="69" y="604" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">as one retrieval unit.</text><text x="453" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">2. SPLIT INTO CHUNKS</text><rect x="459" y="308" width="281" height="45" rx="11" fill="#e9f2ff" stroke="#e9f2ff" stroke-width="2"/><text x="599.5" y="338" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Chunk A · Eligibility</text><rect x="459" y="382" width="281" height="45" rx="11" fill="#e8f6ed" stroke="#e8f6ed" stroke-width="2"/><text x="599.5" y="412" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Chunk B · Exceptions</text><rect x="459" y="456" width="281" height="45" rx="11" fill="#fff0dc" stroke="#fff0dc" stroke-width="2"/><text x="599.5" y="486" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Chunk C · Shipping</text><text x="455" y="568" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Use headings, size limits,</text><text x="455" y="596" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">and optional overlap.</text><text x="838" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">3. RETRIEVE BEST CHUNK</text><rect x="839" y="312" width="286" height="45" rx="11" fill="#e9f2ff" stroke="#e9f2ff" stroke-width="2"/><text x="982.0" y="342" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">User: “Exceptions?”</text><path d="M982 373 L982 428" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="839" y="449" width="286" height="45" rx="11" fill="#e8f6ed" stroke="#e8f6ed" stroke-width="2"/><text x="982.0" y="479" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Chunk B · Exceptions</text><text x="839" y="540" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Return the relevant section,</text><text x="839" y="570" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">not the entire document.</text><rect x="190" y="667" width="205" height="83" rx="11" fill="#e0effd" stroke="none" stroke-width="2"/><text x="292.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Document</text><text x="292.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Original content</text><path d="M403 709 L442 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="440" y="667" width="205" height="83" rx="11" fill="#e7f6f0" stroke="none" stroke-width="2"/><text x="542.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Split</text><text x="542.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Coherent chunks</text><path d="M653 709 L692 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="690" y="667" width="205" height="83" rx="11" fill="#fff0db" stroke="none" stroke-width="2"/><text x="792.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Index</text><text x="792.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Store vectors</text><path d="M903 709 L942 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="940" y="667" width="205" height="83" rx="11" fill="#f0e7fa" stroke="none" stroke-width="2"/><text x="1042.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Retrieve</text><text x="1042.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Best passages</text></svg>