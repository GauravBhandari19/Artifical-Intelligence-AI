<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2263A0"/></marker></defs><rect x="2" y="2" width="1196" height="816" rx="20" fill="#F7FAFE" stroke="#C8D9E8" stroke-width="2"/><circle cx="76" cy="76" r="43" fill="#102F54"/><text x="76" y="91" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="800" fill="white" text-anchor="middle">22</text><text x="139" y="84" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#102F54" text-anchor="start">HUMAN-IN-THE-LOOP</text><text x="48" y="145" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#50657A" text-anchor="start">A human reviews or approves selected AI decisions or actions.</text><path d="M46 171 H1154" stroke="#C8D9E8" stroke-width="2"/><text x="49" y="204" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#2263A0" text-anchor="start">HOW IT WORKS</text><rect x="48" y="224" width="250" height="194" rx="15" fill="#EAF3FA" stroke="#C8D9E8" stroke-width="2"/><text x="65" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2263A0" text-anchor="start">01</text><text x="65" y="293" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#102F54" text-anchor="start">Identify high risk</text><text x="65" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Large refund</text><text x="65" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">or account changes</text><path d="M303 322 L323 322" stroke="#2263A0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="333" y="224" width="250" height="194" rx="15" fill="#E4F5EC" stroke="#C8D9E8" stroke-width="2"/><text x="350" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2263A0" text-anchor="start">02</text><text x="350" y="293" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#102F54" text-anchor="start">Pause workflow</text><text x="350" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Save context and</text><text x="350" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">proposed action</text><path d="M588 322 L608 322" stroke="#2263A0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="618" y="224" width="250" height="194" rx="15" fill="#F0EAFE" stroke="#C8D9E8" stroke-width="2"/><text x="635" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2263A0" text-anchor="start">03</text><text x="635" y="293" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#102F54" text-anchor="start">Human reviews</text><text x="635" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Approve, reject</text><text x="635" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">or edit request</text><path d="M873 322 L893 322" stroke="#2263A0" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="903" y="224" width="250" height="194" rx="15" fill="#FFF1DD" stroke="#C8D9E8" stroke-width="2"/><text x="920" y="258" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="800" fill="#2263A0" text-anchor="start">04</text><text x="920" y="293" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#102F54" text-anchor="start">Resume safely</text><text x="920" y="327" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Execute approved</text><text x="920" y="354" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">action or escalate</text><rect x="48" y="448" width="710" height="241" rx="15" fill="white" stroke="#C8D9E8" stroke-width="2"/><text x="69" y="481" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#2263A0" text-anchor="start">ENGINEERING DETAILS</text><circle cx="82" cy="511" r="8" fill="#2263A0"/><text x="103" y="518" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#102F54" text-anchor="start">Review at the right boundary</text><text x="103" y="543" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Approval happens before irreversible actions.</text><circle cx="82" cy="566" r="8" fill="#2263A0"/><text x="103" y="573" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#102F54" text-anchor="start">Record the decision</text><text x="103" y="598" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Audit who approved what and when.</text><circle cx="82" cy="621" r="8" fill="#2263A0"/><text x="103" y="628" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="800" fill="#102F54" text-anchor="start">Avoid stale approvals</text><text x="103" y="653" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#50657A" text-anchor="start">Revalidate critical details before execution.</text><rect x="778" y="448" width="374" height="241" rx="15" fill="#EDF6FD" stroke="#C8D9E8" stroke-width="2"/><text x="799" y="481" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="800" fill="#2263A0" text-anchor="start">WHY IT MATTERS</text><text x="800" y="520" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#102F54" text-anchor="start">Use people for</text><text x="800" y="547" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#102F54" text-anchor="start">high-impact decisions.</text><text x="800" y="574" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#102F54" text-anchor="start">Keep routine tasks</text><text x="800" y="601" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="400" fill="#102F54" text-anchor="start">automated.</text><rect x="48" y="708" width="1104" height="80" rx="15" fill="#E8F0F5" stroke="#C8D9E8" stroke-width="2"/><text x="70" y="741" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#102F54" text-anchor="start">IN SHORT</text><text x="70" y="769" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="400" fill="#50657A" text-anchor="start">AI proposes → workflow pauses → human decides → backend acts.</text><rect x="778" y="622" width="374" height="67" rx="12" fill="#DDEEEB" stroke="#9BCDBB" stroke-width="2"/><text x="797" y="645" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="800" fill="#2263A0" text-anchor="start">SHOPBOT EXAMPLE</text><text x="797" y="664" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#102F54" text-anchor="start">Manager approves</text><text x="797" y="682" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#102F54" text-anchor="start">a large refund.</text></svg>