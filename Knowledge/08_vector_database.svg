<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878c8"/></marker></defs><rect x="2" y="2" width="1196" height="816" rx="20" fill="#f8fbfe" stroke="#c8d9e6" stroke-width="2"/><circle cx="75" cy="79" r="44" fill="#112d51"/><text x="75" y="94" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">8</text><text x="139" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#112d51" text-anchor="start">VECTOR DATABASE</text><text x="47" y="147" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#506479" text-anchor="start">Index and search embeddings to retrieve semantically similar content.</text><path d="M47 174 H1153" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="430" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="815" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="650" width="1110" height="124" rx="16" fill="#eaf3fa" stroke="#c9dce9" stroke-width="2"/><text x="65" y="686" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="start">IN SHORT</text><text x="68" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">1. INDEX DOCUMENTS</text><rect x="65" y="310" width="290" height="45" rx="11" fill="#e8f2ff" stroke="#e8f2ff" stroke-width="2"/><text x="210.0" y="340" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Document chunks</text><path d="M210 370 L210 417" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="65" y="438" width="290" height="45" rx="11" fill="#e4f5ee" stroke="#e4f5ee" stroke-width="2"/><text x="210.0" y="468" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Embedding model</text><text x="66" y="525" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Convert and store vectors</text><text x="66" y="555" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">with IDs and metadata.</text><text x="453" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">2. STORE + SEARCH</text><ellipse cx="598" cy="346" rx="111" ry="33" fill="#dcecff" stroke="#2878c8" stroke-width="3"/><path d="M487 346 V486 Q598 554 709 486 V346" fill="#e9f4ff" stroke="#2878c8" stroke-width="3"/><ellipse cx="598" cy="486" rx="111" ry="33" fill="none" stroke="#2878c8" stroke-width="3"/><text x="598" y="423" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="800" fill="#112d51" text-anchor="middle">Vector index</text><text x="459" y="570" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Similarity search finds</text><text x="459" y="598" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">nearby stored vectors.</text><text x="838" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">3. RETURN MATCHES</text><rect x="839" y="309" width="288" height="45" rx="11" fill="#e8f2ff" stroke="#e8f2ff" stroke-width="2"/><text x="983.0" y="339" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Query embedding</text><path d="M983 365 L983 405" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="839" y="423" width="288" height="45" rx="11" fill="#e8f5ec" stroke="#e8f5ec" stroke-width="2"/><text x="983.0" y="453" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Top-k matching chunks</text><text x="839" y="515" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Filter by permissions;</text><text x="839" y="544" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">rerank if needed; return</text><text x="839" y="573" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">source text to RAG.</text><rect x="190" y="667" width="205" height="83" rx="11" fill="#e0effd" stroke="none" stroke-width="2"/><text x="292.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Documents</text><text x="292.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Chunk + embed</text><path d="M403 709 L442 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="440" y="667" width="205" height="83" rx="11" fill="#e7f6f0" stroke="none" stroke-width="2"/><text x="542.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Index</text><text x="542.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Store vectors</text><path d="M653 709 L692 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="690" y="667" width="205" height="83" rx="11" fill="#fff0db" stroke="none" stroke-width="2"/><text x="792.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Query</text><text x="792.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Embed question</text><path d="M903 709 L942 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="940" y="667" width="205" height="83" rx="11" fill="#f0e7fa" stroke="none" stroke-width="2"/><text x="1042.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Search</text><text x="1042.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Return top-k</text></svg>