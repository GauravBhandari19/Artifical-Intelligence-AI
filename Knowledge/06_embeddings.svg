<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878c8"/></marker></defs><rect x="2" y="2" width="1196" height="816" rx="20" fill="#f8fbfe" stroke="#c8d9e6" stroke-width="2"/><circle cx="75" cy="79" r="44" fill="#112d51"/><text x="75" y="94" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">6</text><text x="139" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#112d51" text-anchor="start">EMBEDDINGS</text><text x="47" y="147" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#506479" text-anchor="start">Convert content into numeric vectors that capture useful similarities.</text><path d="M47 174 H1153" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="430" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="815" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="650" width="1110" height="124" rx="16" fill="#eaf3fa" stroke="#c9dce9" stroke-width="2"/><text x="65" y="686" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="start">IN SHORT</text><text x="68" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">1. TEXT INPUT</text><rect x="70" y="320" width="265" height="45" rx="11" fill="#e8f2ff" stroke="#e8f2ff" stroke-width="2"/><text x="202.5" y="350" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">“refund request”</text><rect x="70" y="385" width="265" height="45" rx="11" fill="#e8f2ff" stroke="#e8f2ff" stroke-width="2"/><text x="202.5" y="415" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">“return an item”</text><rect x="70" y="450" width="265" height="45" rx="11" fill="#fff0d8" stroke="#fff0d8" stroke-width="2"/><text x="202.5" y="480" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">“weather today”</text><text x="69" y="547" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Similar meaning can use</text><text x="69" y="576" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">different words.</text><text x="453" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">2. EMBEDDING MODEL</text><rect x="460" y="332" width="280" height="45" rx="11" fill="#e4f3ff" stroke="#e4f3ff" stroke-width="2"/><text x="600.0" y="362" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Encoder model</text><path d="M598 390 L598 438" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="460" y="457" width="280" height="45" rx="11" fill="#e6f5ed" stroke="#e6f5ed" stroke-width="2"/><text x="600.0" y="487" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">[0.12, -0.38, ...]</text><text x="458" y="545" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Each input becomes a</text><text x="458" y="575" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">fixed-size number vector.</text><text x="838" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">3. VECTOR SPACE</text><line x1="886" y1="534" x2="1105" y2="534" stroke="#89a6bc" stroke-width="3"/><line x1="886" y1="534" x2="886" y2="327" stroke="#89a6bc" stroke-width="3"/><circle cx="935" cy="383" r="13" fill="#2678c8"/><circle cx="956" cy="401" r="13" fill="#2678c8"/><circle cx="1037" cy="481" r="13" fill="#e7a443"/><text x="842" y="582" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Nearby vectors often</text><text x="842" y="611" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">represent related content.</text><rect x="190" y="667" width="205" height="83" rx="11" fill="#e0effd" stroke="none" stroke-width="2"/><text x="292.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Text</text><text x="292.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Words or chunks</text><path d="M403 709 L442 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="440" y="667" width="205" height="83" rx="11" fill="#e7f6f0" stroke="none" stroke-width="2"/><text x="542.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Embed</text><text x="542.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Run encoder</text><path d="M653 709 L692 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="690" y="667" width="205" height="83" rx="11" fill="#fff0db" stroke="none" stroke-width="2"/><text x="792.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Vector</text><text x="792.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Store numbers</text><path d="M903 709 L942 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="940" y="667" width="205" height="83" rx="11" fill="#f0e7fa" stroke="none" stroke-width="2"/><text x="1042.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Compare</text><text x="1042.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Find similarity</text></svg>