<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878c8"/></marker></defs><rect x="2" y="2" width="1196" height="816" rx="20" fill="#f8fbfe" stroke="#c8d9e6" stroke-width="2"/><circle cx="75" cy="79" r="44" fill="#112d51"/><text x="75" y="94" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle">5</text><text x="139" y="78" font-family="Arial, Helvetica, sans-serif" font-size="43" font-weight="800" fill="#112d51" text-anchor="start">RAG — RETRIEVAL-AUGMENTED GENERATION</text><text x="47" y="147" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#506479" text-anchor="start">Look up relevant evidence before the model generates an answer.</text><path d="M47 174 H1153" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="430" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="815" y="221" width="340" height="406" rx="17" fill="white" stroke="#cbdbe8" stroke-width="2"/><rect x="45" y="650" width="1110" height="124" rx="16" fill="#eaf3fa" stroke="#c9dce9" stroke-width="2"/><text x="65" y="686" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="start">IN SHORT</text><text x="68" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">1. USER QUESTION</text><text x="68" y="305" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#112d51" text-anchor="start">“Can I return an</text><text x="68" y="343" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#112d51" text-anchor="start">opened product?”</text><rect x="68" y="398" width="270" height="45" rx="11" fill="#e8f2ff" stroke="#e8f2ff" stroke-width="2"/><text x="203.0" y="428" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Policy question</text><text x="68" y="490" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#112d51" text-anchor="start">The question tells us</text><text x="68" y="521" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="500" fill="#112d51" text-anchor="start">what evidence to find.</text><text x="453" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">2. RETRIEVE EVIDENCE</text><rect x="449" y="315" width="290" height="45" rx="11" fill="#e6f5ed" stroke="#e6f5ed" stroke-width="2"/><text x="594.0" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Company documents</text><path d="M595 371 L595 413" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="449" y="434" width="290" height="45" rx="11" fill="#fff0d8" stroke="#fff0d8" stroke-width="2"/><text x="594.0" y="464" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Relevant policy chunks</text><text x="449" y="521" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">Search ranks passages</text><text x="449" y="551" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="500" fill="#112d51" text-anchor="start">that answer the question.</text><text x="838" y="260" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#112d51" text-anchor="start">3. GENERATE ANSWER</text><rect x="840" y="315" width="285" height="45" rx="11" fill="#e9edff" stroke="#e9edff" stroke-width="2"/><text x="982.5" y="345" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">LLM + evidence</text><path d="M980 371 L980 415" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="840" y="436" width="285" height="45" rx="11" fill="#e6f5ed" stroke="#e6f5ed" stroke-width="2"/><text x="982.5" y="466" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#112d51" text-anchor="middle">Grounded response</text><text x="839" y="518" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">Cite the policy. If no</text><text x="839" y="547" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">reliable evidence exists,</text><text x="839" y="576" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="500" fill="#112d51" text-anchor="start">say so instead of guessing.</text><rect x="190" y="667" width="205" height="83" rx="11" fill="#e0effd" stroke="none" stroke-width="2"/><text x="292.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Question</text><text x="292.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Customer asks</text><path d="M403 709 L442 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="440" y="667" width="205" height="83" rx="11" fill="#e7f6f0" stroke="none" stroke-width="2"/><text x="542.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Retrieve</text><text x="542.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Find evidence</text><path d="M653 709 L692 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="690" y="667" width="205" height="83" rx="11" fill="#fff0db" stroke="none" stroke-width="2"/><text x="792.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Generate</text><text x="792.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Use context</text><path d="M903 709 L942 709" stroke="#2878c8" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="940" y="667" width="205" height="83" rx="11" fill="#f0e7fa" stroke="none" stroke-width="2"/><text x="1042.5" y="698" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#112d51" text-anchor="middle">Cite</text><text x="1042.5" y="726" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="400" fill="#506479" text-anchor="middle">Show sources</text></svg>